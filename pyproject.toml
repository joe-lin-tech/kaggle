[project]
name = "kaggle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joe-lin-tech", email = "joe.tech.lin@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ipdb>=0.13.13",
    "jsonargparse>=4.52.0",
    "lightning>=2.6.5",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "torch>=2.13.0",
    "wandb>=0.29.0",
]

[project.scripts]
kaggle = "kaggle:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle"]
